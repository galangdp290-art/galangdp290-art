<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Animated developer profile</title>
  <desc id="desc">A neon blue animated developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.5" stop-color="#102d52"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop stop-color="#1e90ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00cfff" flood-opacity=".35"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#72cfff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="900" height="300" rx="24" fill="url(#bg)"/>
  <rect width="900" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="130" cy="80" r="85" fill="#168cff" opacity=".18" filter="url(#blur)"><animate attributeName="cx" values="130;760;130" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="230" r="65" fill="#00e5ff" opacity=".16" filter="url(#blur)"><animate attributeName="cy" values="230;65;230" dur="8s" repeatCount="indefinite"/></circle>
  <path d="M0 245 Q225 170 450 245 T900 245" fill="none" stroke="url(#glow)" stroke-width="2" opacity=".7"><animate attributeName="d" values="M0 245 Q225 170 450 245 T900 245;M0 245 Q225 300 450 245 T900 245;M0 245 Q225 170 450 245 T900 245" dur="6s" repeatCount="indefinite"/></path>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" filter="url(#shadow)">
    <text x="450" y="125" fill="#fff" font-size="42" font-weight="700">Galang.Dhanu</text>
    <text x="450" y="165" fill="#8deaff" font-size="20">DESIGNER • DEVELOPER • CREATOR</text>
    <text x="450" y="210" fill="#c8efff" font-size="16">&lt; build something amazing /&gt;</text>
  </g>
  <g fill="#8deaff"><circle cx="90" cy="50" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="820" cy="80" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="80" cy="220" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle></g>
</svg>
